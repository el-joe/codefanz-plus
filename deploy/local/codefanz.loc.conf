# Local development vhost for CodeFanz (http://codefanz.loc).
# Installed by deploy/local/setup-codefanz-loc.sh — production configs live in docs/DEPLOYMENT_GUIDE.md.
<VirtualHost *:80>
    ServerName codefanz.loc
    ServerAlias www.codefanz.loc

    DocumentRoot /var/www/codefanz-plus/public

    <Directory /var/www/codefanz-plus/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Vite output is content-hashed (app-<hash>.js): cache it for a year and never revalidate (M11).
    <Directory /var/www/codefanz-plus/public/build/assets>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # Compress text responses (HTML, CSS, JS, JSON, SVG, XML sitemaps). Fonts are already compressed (WOFF2).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/rss+xml application/javascript text/javascript application/json image/svg+xml
    </IfModule>

    # Uploads are validated by the app (10 MB per attachment, several files per request).
    <IfModule php_module>
        php_value upload_max_filesize 12M
        php_value post_max_size 64M
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/codefanz.loc_error.log
    CustomLog ${APACHE_LOG_DIR}/codefanz.loc_access.log combined
</VirtualHost>
