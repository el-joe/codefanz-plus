; CodeFanz — queue workers. Install as /etc/supervisor/conf.d/codefanz-workers.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status 'codefanz:*'
; Rendered by deploy/production/render.sh ({{APP_PATH}}, {{APP_USER}}).
;
; Queues in use (grep onQueue / ShouldQueue): default (n8n deliveries, GA4 events, radar AI scoring and Telegram
; alerts, SEO audit crawl), media (OptimizeImage), social (publishing, token refresh, metrics).
; Workers use the connection from QUEUE_CONNECTION (database or redis) — no connection argument here.
;
; Timeouts: a job's own $timeout overrides --timeout. stopwaitsecs must exceed the longest job a worker can be running
; so `supervisorctl stop` / `queue:restart` lets it finish instead of killing it mid-way:
;   default → RunSeoAudit 1800 s   media → OptimizeImage 180 s   social → FetchSocialMetrics 900 s
; The queue connection's retry_after (DB_QUEUE_RETRY_AFTER / REDIS_QUEUE_RETRY_AFTER = 1900) must exceed 1800 s,
; otherwise a long job is handed to a second worker while the first still runs (app:check-production checks this).
;
; Deploys run `php artisan queue:restart`: each worker finishes its current job, exits, and Supervisor starts it
; again from {{APP_PATH}}/current (the new release). --max-time also recycles workers hourly (memory hygiene).

[program:codefanz-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php {{APP_PATH}}/current/artisan queue:work --queue=default --sleep=3 --tries=3 --backoff=10 --timeout=120 --max-time=3600 --memory=256
directory={{APP_PATH}}/current
user={{APP_USER}}
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=1860
redirect_stderr=true
stdout_logfile={{APP_PATH}}/shared/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:codefanz-queue-media]
process_name=%(program_name)s_%(process_num)02d
; Imagick AVIF encoding is memory hungry: one process, larger memory ceiling, recycled every 200 jobs.
command=php -d memory_limit=768M {{APP_PATH}}/current/artisan queue:work --queue=media --sleep=3 --tries=3 --timeout=180 --max-time=3600 --max-jobs=200 --memory=640
directory={{APP_PATH}}/current
user={{APP_USER}}
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=240
redirect_stderr=true
stdout_logfile={{APP_PATH}}/shared/storage/logs/worker-media.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:codefanz-queue-social]
process_name=%(program_name)s_%(process_num)02d
command=php {{APP_PATH}}/current/artisan queue:work --queue=social --sleep=3 --tries=3 --timeout=120 --max-time=3600 --memory=256
directory={{APP_PATH}}/current
user={{APP_USER}}
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile={{APP_PATH}}/shared/storage/logs/worker-social.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Optional: MCP server over Streamable HTTP for remote Claude clients (stdio clients need nothing on the server).
; Build: cd {{APP_PATH}}/current/mcp-server && npm ci && npm run build (deploy.sh does this when MCP_BUILD=1).
; Secrets go in /etc/codefanz/mcp-http.env (root:{{APP_USER}} 0640), never in this file.
; [program:codefanz-mcp-http]
; command=/bin/bash -c 'set -a; . /etc/codefanz/mcp-http.env; exec node {{APP_PATH}}/current/mcp-server/dist/index.js --http'
; directory={{APP_PATH}}/current/mcp-server
; user={{APP_USER}}
; autostart=true
; autorestart=true
; stopasgroup=true
; killasgroup=true
; redirect_stderr=true
; stdout_logfile={{APP_PATH}}/shared/storage/logs/mcp-http.log
; stdout_logfile_maxbytes=10MB
; stdout_logfile_backups=5

[group:codefanz]
programs=codefanz-queue-default,codefanz-queue-media,codefanz-queue-social
