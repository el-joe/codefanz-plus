# CodeFanz — production site. Install as /etc/nginx/sites-available/codefanz and symlink into sites-enabled.
# Rendered by deploy/production/render.sh. Placeholders:
#   {{DOMAIN}}        canonical host, e.g. codefanz.com (must equal the host in APP_URL)
#   {{ALT_DOMAIN}}    the other host that 301s to the canonical one, e.g. www.codefanz.com
#                     (to make www canonical instead, swap the two values — nothing else changes)
#   {{APP_PATH}}      deployment root holding releases/, shared/ and the `current` symlink, e.g. /var/www/codefanz
#   {{PHP_FPM_SOCK}}  PHP-FPM pool socket, e.g. /run/php/php8.3-fpm-codefanz.sock
#   {{SSL_CERT}} / {{SSL_KEY}}  e.g. /etc/letsencrypt/live/codefanz.com/fullchain.pem / privkey.pem
#
# Security headers (CSP with a per-request nonce, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy)
# come from the app's SecurityHeaders middleware. Do NOT add a second CSP here. HSTS is owned by Nginx so that
# static files get it too (the app's copy is hidden to avoid a duplicate header).

# --- HTTP: ACME challenges, everything else → HTTPS on the canonical host -------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}} {{ALT_DOMAIN}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://{{DOMAIN}}$request_uri;
    }
}

# --- HTTPS on the non-canonical host → canonical host -----------------------------------------------------------
server {
    listen 443 ssl http2;            # Nginx ≥ 1.25.1: `listen 443 ssl;` + `http2 on;`
    listen [::]:443 ssl http2;
    server_name {{ALT_DOMAIN}};

    include /etc/nginx/snippets/codefanz-tls.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://{{DOMAIN}}$request_uri;
}

# --- HTTPS canonical site ------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name {{DOMAIN}};

    root {{APP_PATH}}/current/public;
    index index.php;
    charset utf-8;

    include /etc/nginx/snippets/codefanz-tls.conf;

    access_log /var/log/nginx/codefanz.access.log;
    error_log  /var/log/nginx/codefanz.error.log warn;

    # Uploads: Request a Quote takes up to 5 attachments × 10 MB plus form fields; media library files ≤ 10 MB.
    # Keep in step with LEAD_ATTACHMENT_MAX_KB / MEDIA_MAX_UPLOAD_KB and PHP post_max_size (64M).
    client_max_body_size 64m;
    client_body_timeout 60s;
    send_timeout 60s;

    # Real client IP behind a CDN / load balancer (see DEPLOYMENT_GUIDE §5.2). Use EITHER this (Nginx rewrites
    # REMOTE_ADDR; leave TRUSTED_PROXIES empty) OR TRUSTED_PROXIES in .env when a proxy talks plain HTTP to Nginx.
    # set_real_ip_from {{PROXY_CIDR}};   # one line per proxy range (e.g. every Cloudflare range)
    # real_ip_header X-Forwarded-For;      # Cloudflare: CF-Connecting-IP
    # real_ip_recursive on;

    # Trailing-slash normalisation, mirrors public/.htaccess and the RedirectTrailingSlash middleware:
    # /en/ → 301 /en (query string kept). GET/HEAD only so form posts are never turned into GETs.
    if ($request_method ~ ^(GET|HEAD)$) {
        rewrite ^/(.+)/$ /$1 permanent;
    }

    # Never serve dotfiles (.env, .git, .htaccess …) except ACME challenges.
    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Defence in depth: backups, dumps, logs, scripts and source never live under public/, but refuse them anyway.
    location ~* \.(?:env|log|sql|sqlite|gz|tgz|zip|bak|old|orig|sh|ini|conf|lock|md|yml|yaml|dist)$ {
        return 404;
    }

    # Vite output is content-hashed (app-<hash>.js, fonts): cache for a year, never revalidate.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Public disk (storage/app/public via the storage:link symlink). Only optimised media variants live here, under
    # uuid file names, so they are cached long. Anything else under /storage (and any PHP) is refused. Private files
    # (originals, lead attachments, project documents) are in storage/app/private and never web-reachable; they
    # are streamed by authorised controllers.
    location ^~ /storage/ {
        location ^~ /storage/media/ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }

    # No `$uri/` fallback: directory auto-slash redirects would fight the trailing-slash rule above.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only the front controller executes PHP.
    location = /index.php {
        # Defence-in-depth rate limits (zones in conf.d/codefanz-http.conf); the app has its own, stricter ones.
        limit_req zone=cf_login burst=10 nodelay;
        limit_req zone=cf_webhook burst=60 nodelay;
        limit_req zone=cf_mcp burst=30 nodelay;

        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        include fastcgi_params;
        # $realpath_root resolves the `current` symlink, so a deploy switch never mixes two releases in one request
        # and OPcache keys stay per release.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";   # httpoxy

        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;     # AI calls time out at 30 s in the app; long work runs in queue workers
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~ \.php$ {
        return 404;
    }

    # Optional: remote MCP over Streamable HTTP (mcp-server --http on 127.0.0.1:3333, supervisor program
    # codefanz-mcp-http). Leave commented unless remote Claude clients need it; stdio clients do not.
    # location = /mcp {
    #     limit_req zone=cf_mcp burst=30 nodelay;
    #     proxy_pass http://127.0.0.1:3333/mcp;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_buffering off;              # streamed responses
    #     proxy_read_timeout 300s;
    # }
}
