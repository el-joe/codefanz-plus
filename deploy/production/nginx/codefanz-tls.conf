# CodeFanz — TLS settings (Mozilla "intermediate", TLS 1.2 + 1.3). Install as /etc/nginx/snippets/codefanz-tls.conf.
# Generator reference: https://ssl-config.mozilla.org/ (nginx, intermediate). Re-check yearly.
ssl_certificate     {{SSL_CERT}};
ssl_certificate_key {{SSL_KEY}};

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /etc/nginx/dhparam.pem
ssl_dhparam /etc/nginx/dhparam.pem;

ssl_session_timeout 1d;
ssl_session_cache shared:CodeFanzSSL:10m;
ssl_session_tickets off;

# OCSP stapling is intentionally not configured: Let's Encrypt certificates no longer carry an OCSP URL (2025).
# If you use a CA that still serves OCSP, add: ssl_stapling on; ssl_stapling_verify on; resolver 1.1.1.1 9.9.9.9;
