# CodeFanz — http{}-level definitions. Install as /etc/nginx/conf.d/codefanz-http.conf (loaded before sites).
# Rendered from deploy/production/nginx/codefanz-http.conf by deploy/production/render.sh.
#
# Rate limits are DEFENCE IN DEPTH: the application already throttles login, 2FA, password resets, webhooks and
# the MCP API per IP/token (AppServiceProvider + Fortify). These Nginx limits are looser and only stop floods before
# they reach PHP-FPM. Empty keys are not counted, so the maps below limit only the matching requests.

# Credential endpoints (POST only): login, 2FA challenge, password reset request/submit, password confirmation.
map "$request_method:$request_uri" $cf_login_limit_key {
    default "";
    "~^POST:/(login|two-factor-challenge|forgot-password|reset-password|user/confirm-password)(\?|/|$)" $binary_remote_addr;
}

# Gateway / n8n webhooks (payment providers retry bursts; keep generous).
map $request_uri $cf_webhook_limit_key {
    default "";
    "~^/webhooks/" $binary_remote_addr;
}

# MCP API (per IP; the app also limits per token).
map $request_uri $cf_mcp_limit_key {
    default "";
    "~^/api/v1/mcp(/|\?|$)" $binary_remote_addr;
}

limit_req_zone $cf_login_limit_key   zone=cf_login:10m   rate=10r/m;
limit_req_zone $cf_webhook_limit_key zone=cf_webhook:10m rate=300r/m;
limit_req_zone $cf_mcp_limit_key     zone=cf_mcp:10m     rate=120r/m;
limit_req_status 429;
limit_req_log_level warn;

# Compression for text responses. WOFF2, AVIF, WebP, JPEG and PNG are already compressed — never gzip them.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml application/rss+xml application/manifest+json image/svg+xml;

# Brotli (optional): requires the ngx_brotli module (Ubuntu: apt install libnginx-mod-http-brotli-filter
# libnginx-mod-http-brotli-static). Uncomment after installing; keeps gzip as the fallback.
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/json
#              application/xml application/rss+xml application/manifest+json image/svg+xml;

# Hide the Nginx version in error pages and the Server header.
server_tokens off;
