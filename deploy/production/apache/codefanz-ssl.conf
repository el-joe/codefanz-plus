# CodeFanz — Apache 2.4 alternative to the Nginx site (appendix; Nginx is the reference setup).
# Modules: a2enmod ssl http2 headers rewrite proxy_fcgi setenvif deflate expires remoteip
# Rendered by render.sh ({{DOMAIN}}, {{ALT_DOMAIN}}, {{APP_PATH}}, {{PHP_FPM_SOCK}}, {{SSL_CERT}}, {{SSL_KEY}}).
# public/.htaccess already redirects trailing slashes (/en/ → /en) and routes everything to index.php.

<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAlias {{ALT_DOMAIN}}
    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://{{DOMAIN}}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName {{ALT_DOMAIN}}
    SSLEngine on
    SSLCertificateFile {{SSL_CERT}}
    SSLCertificateKeyFile {{SSL_KEY}}
    Redirect permanent / https://{{DOMAIN}}/
</VirtualHost>

<VirtualHost *:443>
    ServerName {{DOMAIN}}
    DocumentRoot {{APP_PATH}}/current/public
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile {{SSL_CERT}}
    SSLCertificateKeyFile {{SSL_KEY}}
    # Mozilla intermediate
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # App sends HSTS on PHP responses; set it here for every response and avoid a duplicate.
    Header always unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    ServerSignature Off

    <Directory {{APP_PATH}}/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Only the media variants on the public disk are served; dotfiles never.
    <LocationMatch "^/storage/(?!media/)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <Directory {{APP_PATH}}/current/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <LocationMatch "^/storage/media/">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/rss+xml application/javascript text/javascript application/json image/svg+xml
    LimitRequestBody 67108864

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:{{PHP_FPM_SOCK}}|fcgi://localhost"
    </FilesMatch>
    ProxyTimeout 60

    # Behind a CDN: RemoteIPHeader CF-Connecting-IP / X-Forwarded-For + RemoteIPTrustedProxy <range>
    ErrorLog ${APACHE_LOG_DIR}/codefanz_error.log
    CustomLog ${APACHE_LOG_DIR}/codefanz_access.log combined
</VirtualHost>
