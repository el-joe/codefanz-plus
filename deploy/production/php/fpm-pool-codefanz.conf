; CodeFanz — PHP-FPM pool. Install as /etc/php/8.3/fpm/pool.d/codefanz.conf (and disable the stock www pool if
; unused: mv www.conf www.conf.disabled). Rendered by deploy/production/render.sh.
;   {{APP_USER}}      unix user that owns {{APP_PATH}} (runs PHP, queue workers and cron), e.g. codefanz
;   {{PHP_FPM_SOCK}}  socket path also used by the Nginx site, e.g. /run/php/php8.3-fpm-codefanz.sock

[codefanz]
user = {{APP_USER}}
group = {{APP_USER}}

listen = {{PHP_FPM_SOCK}}
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process sizing. One Laravel request ≈ 40–70 MB RSS. Budget: (RAM − MySQL − Redis − workers − OS) / 70 MB.
;   2 GB VPS: pm.max_children = 10   (MySQL ~500 MB, 3–4 queue workers ~400 MB, OS ~300 MB)
;   4 GB VPS: pm.max_children = 24   (raise MySQL innodb_buffer_pool_size to ~1 GB first)
; Watch "server reached pm.max_children" in the FPM log and the status page before raising it.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.process_idle_timeout = 30s

; Kill runaway requests a little after Nginx gives up (fastcgi_read_timeout 60s).
request_terminate_timeout = 75s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.3-fpm-codefanz.slow.log

; Local-only status/ping for monitoring (expose through an allow-listed Nginx location if needed).
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes

; Per-pool PHP settings (php_admin_* cannot be changed by the application).
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 64M
php_admin_value[max_file_uploads] = 20
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-codefanz.error.log
; The web app never shells out (checked in M12). Remove proc_open/popen only if you switch MAIL_MAILER to sendmail.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Optional hardening; test every feature (media upload → AVIF/WebP, PDF attachments, mail) after enabling:
; php_admin_value[open_basedir] = {{APP_PATH}}/:/tmp/:/dev/urandom
php_admin_value[session.save_handler] = files
php_admin_flag[allow_url_include] = off
