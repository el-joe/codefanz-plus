; CodeFanz — PHP production settings. Install for FPM and CLI:
;   /etc/php/8.3/fpm/conf.d/99-codefanz.ini  and  /etc/php/8.3/cli/conf.d/99-codefanz.ini
; Then: systemctl reload php8.3-fpm. Required extensions: see DEPLOYMENT_GUIDE §2.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = UTC

upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache. validate_timestamps=0: code changes only take effect after `systemctl reload php8.3-fpm`, which the
; deploy script does after switching the `current` symlink.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
; JIT brings little for I/O-bound Laravel requests; leave off unless profiling shows a gain.
opcache.jit = disable
opcache.jit_buffer_size = 0
